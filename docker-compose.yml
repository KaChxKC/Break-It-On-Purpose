services:
  postgres:
    image: postgres:16-alpine
    container_name: biop-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biop_local_pw}
      POSTGRES_DB: ${POSTGRES_DB:-biop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biop} -d ${POSTGRES_DB:-biop}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
